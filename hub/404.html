<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /* theme-boot */
      (function () {
        try {
          var saved = localStorage.getItem("hub-theme-v2");
          if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="noindex" />
    <meta name="description" content="AI Guide Hub 页面不存在：回到首页，重新选一套教程。" />
    <title>404 · AI Guide Hub</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/assets/hub.css" />
  </head>
  <body>
    <main class="section" style="max-width:720px;margin:15vh auto;padding:0 22px">
      <div class="eyebrow">404</div>
      <h1 style="font-size:48px;letter-spacing:-.04em;margin:8px 0">页面不存在</h1>
      <p style="color:var(--muted)">回到首页，重新选一套教程。</p>
      <p><a class="btn primary" href="/">回到首页</a></p>
    </main>
  </body>
</html>
